# Verify pull requests with the same `npm run verify` the Deploy workflow runs
# after merge. Context drafts promoted from the ops dashboard open pull
# requests here (LIF-1298); a context change that breaks the next_step size
# limits or the installed-client contract fails before merge, not at deploy.

name: Verify

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/staging' }}

jobs:
  # staging only deploys (LIF-1651); it runs no test suite.
  verify:
    if: github.ref != 'refs/heads/staging'
    name: Verify (typecheck + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run verify
          python3 -m unittest discover -s scripts -p test_deploy_pilot.py

      # Deploy reuses this result when main's tree is identical to the tree
      # verified here (the pull request merge commit), so it records it.
      - name: Record the verified tree
        id: tree
        run: |
          git rev-parse 'HEAD^{tree}' | tee "$RUNNER_TEMP/verified-tree"
          echo "sha=$(cat "$RUNNER_TEMP/verified-tree")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: verified-tree-${{ steps.tree.outputs.sha }}
          path: ${{ runner.temp }}/verified-tree
          retention-days: 7
          overwrite: true

  deploy-pilot:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/staging' && vars.CONNECTION_PROFILE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-pilot
      cancel-in-progress: false
    env:
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_PUBLISHABLE_KEY }}
      LIFTY_EMAIL_SERVER_KEY: ${{ secrets.STAGING_EMAIL_SERVER_KEY }}
      LIFTY_LINKEDIN_SERVER_KEY: ${{ secrets.STAGING_LINKEDIN_SERVER_KEY }}
      UNIPILE_V2_ACCESS_TOKEN: ${{ secrets.STAGING_UNIPILE_ACCESS_TOKEN }}
      LIFTY_PILOT_APP_ID: ${{ vars.LIFTY_PILOT_APP_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Deploy isolated staging API after database/replay readiness
        run: python3 scripts/deploy-pilot.py
