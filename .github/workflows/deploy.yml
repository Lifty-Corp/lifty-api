# Deploy lifty-api to the DigitalOcean App Platform app (lifty-api-staging).
#
# On push to main: run the full verify tier (npm run verify:full), then run
# scripts/digitalocean.sh deploy <sha>. Verify is skipped only when the full
# tier of verify.yml passed on this exact tree in a same-repository release
# pull request (develop -> main). Fast-tier runs (feature and hotfix pull
# requests) never count, and no branch protection requires up-to-date
# branches, so any other tree is verified here (LIF-1653). The script is the safety net: it
# validates the app spec still points at this repo#main, confirms remote main
# is exactly this commit, creates the deployment, waits for it to go ACTIVE,
# verifies the active deployment's source commit, and runs the smoke checks.
# If retired integration env entries remain, the script deploys the filtered
# live spec and current source together instead of creating another deployment.
# The deployed version is therefore always the head of main — a run whose
# commit has been superseded by a newer push fails validation and the newer
# run deploys instead.
#
# Required repo secret:
#   DIGITALOCEAN_ACCESS_TOKEN — DigitalOcean API token for doctl.
#
# Manual redeploy of current main: Actions → Deploy → Run workflow.

name: Deploy

on:
  push:
    branches: [main]
    # Human documentation is not a runtime input. Do not exclude **/*.md:
    # src/agent-context Markdown is packaged and must still deploy.
    paths-ignore:
      - AGENTS.md
      - CLAUDE.md
      - README.md
      - RUNBOOK.md
      - docs/**
  workflow_dispatch:

# One deploy at a time; never cancel an in-flight deployment.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # find the pull request Verify run for this tree

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Verify + deploy to DO App Platform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Only the full tier records verified-tree-full-<tree>, and only the
      # release pull request (head develop) runs the full tier on pull_request.
      - name: Reuse a passing full-tier release pull request Verify run for this tree
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=verified-tree-full-$tree" \
            --jq '[.artifacts[] | select(.expired | not)
                   | select(.workflow_run.head_repository_id == .workflow_run.repository_id)
                   | .workflow_run.id] | unique | .[]')
          for run in $runs; do
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" \
              --jq 'select(.path == ".github/workflows/verify.yml" and .event == "pull_request"
                           and .head_branch == "develop" and .conclusion == "success") | .html_url')
            if [ -n "$passed" ]; then
              echo "Tree $tree already passed the full Verify tier: $passed"
              echo "verified=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No passing full-tier release pull request Verify run for tree $tree; verifying here."

      - uses: actions/setup-node@v4
        if: steps.reuse.outputs.verified != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.reuse.outputs.verified != 'true'
        run: npm ci

      - name: Verify (full tier)
        if: steps.reuse.outputs.verified != 'true'
        run: npm run verify:full

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Deploy exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/digitalocean.sh deploy "$GITHUB_SHA"
