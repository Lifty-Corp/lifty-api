name: Sync staging

# Keep staging equal to main plus the work under test (LIF-1754). Every push to
# main merges main into staging without force. A conflict with the work under
# test fails this job and leaves staging unchanged; resolve it by hand.
# A push made with the built-in token starts no workflow, so this job
# dispatches verify.yml on staging itself.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-staging
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: staging
          fetch-depth: 0
      - name: Merge main into staging
        id: merge
        env:
          GIT_AUTHOR_NAME: juan-lifty
          GIT_AUTHOR_EMAIL: juan@liftygtm.com
          GIT_COMMITTER_NAME: juan-lifty
          GIT_COMMITTER_EMAIL: juan@liftygtm.com
        run: |
          git fetch origin main
          before=$(git rev-parse HEAD)
          if ! git merge --no-edit origin/main; then
            git merge --abort
            echo "::error::main conflicts with the work under test on staging; merge it by hand (LIF-1754)."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" = "$before" ]; then
            echo "staging already contains main"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin HEAD:staging
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Start the staging deploy
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run verify.yml --ref staging
